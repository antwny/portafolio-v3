<header class="navbar" [class.scrolled]="isScrolled()">
  <div class="scroll-progress-bar" [style.width.%]="scrollProgress()" aria-hidden="true"></div>
  <div class="navbar-inner">
    <a href="#inicio" class="navbar-logo" (click)="closeMenu()">
      <span class="logo-text">ANTWNY</span>
      <span class="logo-sub">COMPUTING / SOFTWARE</span>
    </a>

    <nav class="navbar-links" [class.open]="isMenuOpen()" aria-label="Navegación principal">
      <a href="#inicio" [class.active]="activeSection() === 'inicio'" (click)="closeMenu()">
        <span class="link-num">01</span> Inicio
      </a>
      <a href="#sobre-mi" [class.active]="activeSection() === 'sobre-mi'" (click)="closeMenu()">
        <span class="link-num">02</span> Perfil
      </a>
      <a href="#proyectos" [class.active]="activeSection() === 'proyectos'" (click)="closeMenu()">
        <span class="link-num">03</span> Proyectos
      </a>
      <a href="#experiencia" [class.active]="activeSection() === 'experiencia'" (click)="closeMenu()">
        <span class="link-num">04</span> Trayectoria
      </a>
      <a href="#contacto" [class.active]="activeSection() === 'contacto'" (click)="closeMenu()">
        <span class="link-num">05</span> Contacto
      </a>
    </nav>

    <div class="navbar-actions">
      <button
        class="theme-toggle"
        (click)="toggleDark()"
        [attr.aria-label]="isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        [title]="isDark() ? 'Modo claro' : 'Modo oscuro'"
      >
        @if (isDark()) {
          <svg
            class="theme-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="5" />
            <path
              d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
            />
          </svg>
        } @else {
          <svg
            class="theme-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        }
      </button>

      <button
        class="menu-toggle"
        (click)="toggleMenu()"
        [attr.aria-label]="isMenuOpen() ? 'Cerrar menú' : 'Abrir menú'"
        [attr.aria-expanded]="isMenuOpen()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
